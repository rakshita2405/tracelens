
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TRACELENS_API_URL: http://backend:8000
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - backend
